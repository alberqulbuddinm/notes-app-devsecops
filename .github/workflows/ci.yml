name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: notes-app

jobs:
  # 1. Unit Test
  test:
    name: Unit Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
      - name: Run pytest
        run: PYTHONPATH=. pytest -v

  # 2. SAST
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install -r dev-requirements.txt
      - name: Run Bandit
        run: bandit -r app -ll

  # 3. SCA
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt
      - name: Audit dev-requirements.txt
        run: pip-audit -r dev-requirements.txt

  # 4. Secret Scan
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
      - name: Run Gitleaks (scan seluruh history)
        run: ./gitleaks git . --redact --verbose

  # 5. Build & Push (hanya jalan jika 4 job di atas lulus)
  build_and_push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # 6. Image Scan dari Docker Hub
  trivy:
    name: Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Scan image dari Docker Hub
        # Pakai image resmi Trivy 0.69.3 (versi aman pasca insiden supply-chain Maret 2026)
        run: |
          docker run --rm aquasec/trivy:0.69.3 image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --no-progress \
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
